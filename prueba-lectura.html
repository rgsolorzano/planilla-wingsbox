<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wingsbox · Prueba de lectura</title>
<style>
  :root{
    --fondo:#faf9f7; --tarjeta:#fff; --texto:#1c1a17; --suave:#6b6660;
    --borde:#e3dfd9; --acento:#b4472a; --ok:#2f6f4e; --mal:#9a3324; --tenue:#f3f0ec;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --fondo:#171614; --tarjeta:#201e1b; --texto:#f0ece6; --suave:#a39d95;
      --borde:#332f2b; --acento:#e0714d; --ok:#6fbf8f; --mal:#e08a73; --tenue:#262320;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--fondo);color:var(--texto);padding:24px 16px;
    font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .envoltura{max-width:820px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between}
  h1{font-size:21px;margin:0}
  .sub{color:var(--suave);font-size:14px;margin:0 0 22px}
  a{color:var(--acento)}
  .aviso{padding:11px 14px;border-radius:9px;font-size:14px;margin:0 0 18px;
    border:1px solid var(--borde);background:var(--tarjeta)}
  .aviso.ok{color:var(--ok)} .aviso.mal{color:var(--mal)}
  table{width:100%;border-collapse:collapse;background:var(--tarjeta);
    border:1px solid var(--borde);border-radius:12px;overflow:hidden;margin-bottom:18px}
  th,td{text-align:left;padding:9px 14px;border-bottom:1px solid var(--borde);font-size:14px}
  th{background:var(--tenue);font-weight:600;color:var(--suave);font-size:12.5px;
    text-transform:uppercase;letter-spacing:.04em}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:none}
  .si{color:var(--ok)} .no{color:var(--mal)}
  pre{background:var(--tarjeta);border:1px solid var(--borde);border-radius:9px;
    padding:12px 14px;overflow:auto;font-size:12.5px;margin:0 0 18px}
  button{font:inherit;font-weight:600;padding:10px 16px;border-radius:9px;cursor:pointer;
    border:1px solid var(--acento);background:var(--acento);color:#fff}
</style>
</head>
<body>
<div class="envoltura">
  <header><h1>Prueba de lectura</h1><a href="login.html">← Volver</a></header>
  <p class="sub">Lee la base con el adaptador real y comprueba que PostgREST responde como se espera</p>
  <div id="salida">Conectando…</div>
</div>

<script type="module">
const SUPABASE_URL = 'https://ylarfmswevnkzpqqkklg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_tO34kGlfOe9z2WE1t_bgYw_iKWmOGBq';

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm';
import { crearLector, consultarConSupabase } from './datos-supabase.mjs';

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
const salida = document.getElementById('salida');
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* Lo que 05_datos_prueba.sql deja en una base por lo demás VACÍA. Si ya
   cargaste datos reales, estos números no cuadrarán y no significa nada: la
   comprobación que no depende del contenido es la paginación, más abajo. */
const ESPERADO = { Empleados: 1, Horarios: 7, Marcaciones: 1200, Propinas: 4,
                   Descuentos: 3, PagosExtra: 2, DiasLibres: 3 };

async function correr(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){
    salida.innerHTML = '<div class="aviso">No has iniciado sesión. <a href="login.html">Entrar</a></div>';
    return;
  }

  salida.innerHTML = '<div class="aviso">Leyendo…</div>';
  const t0 = performance.now();
  let hojas;
  try {
    hojas = await crearLector(consultarConSupabase(sb)).leerPlanilla();
  } catch(e){
    salida.innerHTML = `<div class="aviso mal"><strong>Falló la lectura</strong><br>${esc(e.message)}</div>
      <p class="sub">Si menciona un esquema inválido, falta agregar <code>core</code> y
      <code>externo</code> en Settings → Data API → Exposed schemas.</p>`;
    return;
  }
  const ms = Math.round(performance.now() - t0);

  // Fila 0 son los encabezados: no cuenta como dato.
  const filas = Object.entries(hojas).map(([n, m]) => [n, Math.max(0, m.length - 1)]);
  let fallos = 0;
  const cuerpo = filas.map(([n, c]) => {
    const esp = ESPERADO[n];
    let veredicto = '<span class="sub">—</span>';
    if(esp !== undefined){
      const bien = c === esp;
      if(!bien) fallos++;
      veredicto = bien ? '<span class="si">correcto</span>'
                       : `<span class="no">se esperaban ${esp}</span>`;
    }
    return `<tr><td>${esc(n)}</td><td class="n">${c}</td><td>${veredicto}</td></tr>`;
  }).join('');

  /* La paginación se juzga por haber superado el tope de 1,000, no por un
     número exacto: así la prueba sigue valiendo aunque la base tenga otros
     datos. Exactamente 1,000 es el síntoma clásico de truncamiento. */
  const nMarc = (hojas.Marcaciones?.length ?? 1) - 1;
  const paginacion = nMarc > 1000;
  salida.innerHTML = `
    <div class="aviso ${fallos ? 'mal' : 'ok'}">
      ${fallos ? `${fallos} hoja(s) con el número equivocado.`
               : `Todo correcto. La lectura completa tardó ${ms} ms.`}
    </div>
    <div class="aviso ${paginacion ? 'ok' : 'mal'}">
      <strong>Paginación:</strong>
      ${paginacion ? `funciona — se leyeron ${nMarc} marcaciones, más allá del límite de 1,000 por petición de PostgREST.`
                   : (nMarc === 1000
                      ? 'FALLA — llegaron exactamente 1,000 marcaciones, que es el tope por petición. Con datos reales la planilla saldría incompleta sin avisar.'
                      : `llegaron ${nMarc} marcaciones: menos de 1,000, así que esta corrida no llega a probar la paginación. Ejecuta 05_datos_prueba.sql.`)}
    </div>
    <table>
      <thead><tr><th>Hoja</th><th class="n">Filas</th><th>Resultado</th></tr></thead>
      <tbody>${cuerpo}</tbody>
    </table>
    <p class="sub">Primera fila de datos de cada hoja, tal como la recibiría la app:</p>
    <pre>${esc(Object.entries(hojas).map(([n,m]) =>
        n.padEnd(22) + JSON.stringify(m[1] ?? null)).join('\n'))}</pre>
    <button id="otra">Volver a leer</button>`;
  document.getElementById('otra').onclick = correr;
}

correr();
</script>
</body>
</html>
